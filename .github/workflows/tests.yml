name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run engine tests
        run: node --test test/engine.test.js

      - name: Rebuild the single-file version
        run: node build-standalone.mjs

      - name: Check the committed build is up to date
        run: git diff --exit-code -- enigma-standalone.html
